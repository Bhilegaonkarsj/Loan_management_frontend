<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Education Loan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">
  <div class="dashboard-wrapper">
    <main class="dashboard-main">
      <h2>🎓 Education Loan</h2>
      <section id="loanDetails" class="loan-details">
        <!-- details OR form will go here -->
      </section>
      <button onclick="goBack()">← Back</button>
    </main>
    <aside class="dashboard-sidebar">
      <!-- your sidebar menu -->
    </aside>
  </div>
  <script>
    // on load, fetch /api/loan/check for 'HOME'
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token'),
            userId = localStorage.getItem('userId'),
            details = document.getElementById('loanDetails');

      fetch('http://localhost:8080/api/loan/check', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'userId': userId,
          'token': token
        },
        body: JSON.stringify({ userId: +userId, loanType: 'EDUCATION' })
      })
      .then(r => r.json())
      .then(resp => {
        if (resp.exists) {
          const l = resp.loan;
          details.innerHTML = `
            <h3>Your Education Loan</h3>
            <p><strong>Amount:</strong> ₹${l.amount}</p>
            <p><strong>Status:</strong> ${l.status}</p>
            <p><strong>Interest:</strong> ${l.interestRate}%</p>
          `;
        } else {
          details.innerHTML = `
            <h3>Apply for Education Loan</h3>
            <form id="applyForm">
              <label>Amount (₹):</label><br/>
              <input type="number" id="amount" required><br/>
              <label>Tenure (yrs):</label><br/>
              <input type="number" id="tenure" required><br/><br/>
              <button type="submit">Apply</button>
            </form>
          `;
          document.getElementById('applyForm').addEventListener('submit', e => {
            e.preventDefault();
            fetch('http://localhost:8080/api/loans/apply', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'userId': userId,
                'token': token
              },
              body: JSON.stringify({
                userId: +userId,
                loanType: 'EDUCATION',
                amount: +document.getElementById('amount').value,
                tenure: +document.getElementById('tenure').value
              })
            })
            .then(r => r.json())
            .then(d => {
              details.innerHTML = `<p style="color:green;">${d.message || 'Loan applied!'}</p>`;
            });
          });
        }
      });
    });

    function goBack() {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
