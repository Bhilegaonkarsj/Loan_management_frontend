<h2>Login</h2>
<form id="loginForm">
  <input type="number" id="userId" placeholder="Enter User ID" required /><br />
  <button type="submit">Login</button>
</form>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const userId = parseInt(document.getElementById("userId").value);

    fetch("http://localhost:8080/api/user/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ user_id: userId })  // ✅ use value from input
    })
    .then(res => {
      if (!res.ok) throw new Error("Login failed");
      return res.json();
    })
    .then(data => {
      localStorage.setItem("token", data.token);  // ✅ store token
      window.location.href = "profile.html";      // ✅ redirect
    })
    .catch(err => {
      alert("Login failed: " + err.message);      // ❗ show error
    });
  });
</script>
