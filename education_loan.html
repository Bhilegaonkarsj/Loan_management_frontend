<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Education Loan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">
  <div class="dashboard-wrapper">
    <main class="dashboard-main">
      <h2>🏠 Education Loan</h2>
      <section id="loanDetails" class="loan-details">
        <!-- Loan info or form goes here -->
      </section>
      <button onclick="goBack()">← Back</button>
    </main>
    <aside class="dashboard-sidebar">
      <!-- your sidebar content -->
    </aside>
  </div>

  <script>document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    const userId = localStorage.getItem('userId');
    const details = document.getElementById('loanDetails');
    console.log("userId in Education loan check :" + userId);
  
    fetch('http://localhost:8080/api/loans/check', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'userId': userId,
        'token': token
      },
      body: JSON.stringify({ userId: +userId, loanType: 'EDUCATION' })
    })
    .then(r => r.json())
    .then(resp => {
      const loans = Array.isArray(resp.data) ? resp.data : [];
  
      if (loans.length > 0 && loans[0].loanAmount !== null) {
        const l = loans[0];
        const loanAmount = l.totalAmountForLoan || 0;
        const paid = l.paidAmount || 0;
        const remaining = l.remianingAmount || 0;
        const percent = loanAmount > 0 ? Math.round((paid / loanAmount) * 100) : 0;
        details.innerHTML = `
        <h3>Your Education Loan</h3>

  <div class="loan-bar-wrapper">
    <div class="loan-bar-label top-right">Total: ₹${l.totalAmountForLoan}</div>

   <div class="progress-bar-container" style="position: relative; background: #ccc; height: 20px; border-radius: 10px;">
  <div class="progress-bar" style="
    background: green;
    height: 100%;
    width: ${percent}%;
    border-radius: 10px;
    position: relative;
  ">
    <span style="
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      font-weight: bold;
      line-height: 20px;
      font-size: 12px;
    ">
      ${percent}% Paid
    </span>
  </div>
</div>


    <div class="loan-bar-label bottom-right">Remaining: ₹${l.remianingAmount}</div>
    <div class="loan-bar-label bottom-left">Paid: ₹${l.paidAmount}</div>
  </div>

  <p><strong>Status:</strong> ${l.status || 'N/A'}</p>
  <p><strong>Reason:</strong> ${l.reason}</p>
  <p><strong>Created At:</strong> ${l.createdTimestamp}</p>

  <button id="viewStatementBtn">📄 View Statement</button>
<div id="statementContainer" style="margin-top: 20px;"></div>

<!-- Payment or Add More Form -->
<h4>Add Payment or Increase Loan</h4>
<form id="addLoanForm">
  <label>New Loan Amount or Installment (₹):</label><br/>
  <input type="number" id="amount" required><br/><br/>

  <label>Total Repayable Amount (₹):</label><br/>
  <input type="number" id="totalAmount" required><br/><br/>

    <label>Select Account:</label><br/>
           <select id="accountNumber" required>
           <option value="">Loading...</option>
           </select><br/><br/>

  <label>Reason:</label><br/>
  <textarea id="reason" rows="3" required></textarea><br/><br/>

  <button type="submit">Submit</button>
</form>

        `;

        document.getElementById('viewStatementBtn').addEventListener('click', () => {
  const container = document.getElementById('statementContainer');
  container.innerHTML = '<p>Loading statement...</p>';

  fetch('http://localhost:8080/api/payments/summary', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'userId': userId,
      'token': token
    },
    body: JSON.stringify({
      userId: +userId,
      loanId: loans[0].loanId
    })
  })
  .then(res => res.json())
  .then(data => {
    const txns = data.data || [];
    if (txns.length === 0) {
      container.innerHTML = '<p>No transactions found.</p>';
      return;
    }

    let html = `
      <h4>📌 Transaction Summary</h4>
      <table border="1" cellpadding="6" cellspacing="0" style="width:100%; border-collapse: collapse;">
        <thead>
          <tr>
            <th>Txn ID</th>
            <th>Account</th>
            <th>Amount (₹)</th>
            <th>Date & Time</th>
          </tr>
        </thead>
        <tbody>
    `;

    txns.forEach(txn => {
      html += `
        <tr>
          <td>${txn.transactionId}</td>
          <td>${txn.accountNumber || 'N/A'}</td>
          <td>${txn.transactionAmount}</td>
          <td>${txn.transactionTimestamp}</td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  })
  .catch(err => {
    container.innerHTML = `<p style="color:red;">Error loading statement: ${err.message}</p>`;
  });
});
  


        fetch('http://localhost:8080/api/user/accounts', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json',
    'userId': userId,
    'token': token
  },
  body: JSON.stringify({ userId: userId })

})
.then(res => res.json())
.then(resp => {
  const accountSelect = document.getElementById('accountNumber');
  accountSelect.innerHTML = ''; // clear existing options

  if (resp.data && resp.data.accountsList && resp.data.accountsList.length > 0) {
    resp.data.accountsList.forEach(acc => {
      const option = document.createElement('option');
      option.value = acc;
      option.textContent = acc;
      accountSelect.appendChild(option);
    });
  } else {
    const opt = document.createElement('option');
    opt.text = 'No accounts found';
    opt.disabled = true;
    accountSelect.add(opt);
  }
})
.catch(err => {
  console.error('Error loading accounts:', err);
});

        document.getElementById('addLoanForm').addEventListener('submit', e => {
  e.preventDefault();

  const payload = {
    userId: +userId,
    loanType: 'EDUCATION', // or HOME / EDUCATION depending on page
    reason: document.getElementById('reason').value,
    loanAmount: parseFloat(document.getElementById('amount').value),
    totalAmount: parseFloat(document.getElementById('totalAmount').value),
    accountNumber: document.getElementById('accountNumber').value

  };

  fetch('http://localhost:8080/api/loans/apply', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'userId': userId,
      'token': token
    },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(d => {
    document.getElementById('loanDetails').innerHTML =
      `<p style="color:green;">${d.message || 'Request submitted successfully!'}</p>`;
  })
  .catch(err => {
    document.getElementById('loanDetails').innerHTML =
      `<p style="color:red;">Error: ${err.message}</p>`;
  });
});

      } else {
        details.innerHTML = `
          <p style="color: orange;"><strong>No valid education loan found.</strong></p>
          <h3>Apply for Education Loan</h3>
          <form id="applyForm">
            <label>Loan Amount (₹):</label><br/>
            <input type="number" id="amount" required><br/><br/>
  
            <label>Total Repayable Amount (₹):</label><br/>
            <input type="number" id="totalAmount" required><br/><br/>

            <label>Select Account:</label><br/>
           <select id="accountNumber" required>
           <option value="">Loading...</option>
           </select><br/><br/>

            <label>Reason:</label><br/>
            <textarea id="reason" rows="3" required></textarea><br/><br/>
  
            <button type="submit">Apply</button>
          </form>
        `;

        document.getElementById('applyForm').addEventListener('submit', e => {
          e.preventDefault();
  
          const payload = {
            userId: +userId,
            loanType: 'EDUCATION',
            reason: document.getElementById('reason').value,
            loanAmount: parseFloat(document.getElementById('amount').value),
            totalAmount: parseFloat(document.getElementById('totalAmount').value),

          };
  
          fetch('http://localhost:8080/api/loans/apply', {

          .then(res => res.json())
          .then(d => {
