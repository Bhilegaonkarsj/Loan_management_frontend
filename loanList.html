<h2>My Loans</h2>
<ul id="loanList"></ul>

<script>
  fetch("http://localhost:8080/api/loans", {
    headers: { Authorization: "Bearer " + localStorage.getItem("token") }
  })
  .then(res => res.json())
  .then(loans => {
    const list = document.getElementById("loanList");
    loans.forEach(loan => {
      const li = document.createElement("li");
      li.innerText = `₹${loan.loanAmount} for ${loan.tenureMonths} months - Status: ${loan.status}`;
      list.appendChild(li);
    });
  });
</script>
