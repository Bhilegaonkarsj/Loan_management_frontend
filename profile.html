<h2>User Profile</h2>
<div id="profileContainer"></div>
<a href="apply-loan.html">Apply for a Loan</a> |
<a href="loan-list.html">View My Loans</a>

<script>
  fetch("http://localhost:8080/api/users/me", {
    headers: { Authorization: "Bearer " + localStorage.getItem("token") }
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("profileContainer").innerText = JSON.stringify(data);
  });
</script>
