<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">
  <div class="dashboard-wrapper">
    <!-- Main Content -->
    <main class="dashboard-main">
      <h2>Welcome, <span id="userName">User</span></h2>
      <h3>Available Loan Schemes</h3>

      <div class="loan-cards">
        <div class="loan-card" onclick="location.href='home_loan.html'">
          <div class="loan-icon">🏠</div>
          <h4>Home Loan</h4>
          <p class="loan-amount">Up to ₹50L</p>
          <p class="loan-rate">@ 8.5% interest</p>
        </div>
      
        <div class="loan-card" onclick="location.href='education_loan.html'">
          <div class="loan-icon">🎓</div>
          <h4>Education Loan</h4>
          <p class="loan-amount">Up to ₹20L</p>
          <p class="loan-rate">@ 7.1% interest</p>
        </div>
      
        <div class="loan-card" onclick="location.href='personal_loan.html'">
          <div class="loan-icon">👤</div>
          <h4>Personal Loan</h4>
          <p class="loan-amount">Up to ₹10L</p>
          <p class="loan-rate">@ 10.5% interest</p>
        </div>
      
        <div class="loan-card" onclick="location.href='vehicle_loan.html'">
          <div class="loan-icon">🚗</div>
          <h4>Vehicle Loan</h4>
          <p class="loan-amount">Up to ₹15L</p>
          <p class="loan-rate">@ 9.2% interest</p>
        </div>
      </div>
      
      
      <!-- <section id="loanDetails" class="loan-details">
        <p>Select a loan scheme to view more details.</p>
      </section> -->

      <button class="btn-logout" onclick="logout()">Logout</button>
    </main>

    <!-- Sidebar Menu -->
    <aside class="dashboard-sidebar">
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="profile.html">My Profile</a></li>
          <li><a href="transactions.html">Transactions</a></li>
          <li><a href="reports.html">Reports</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </aside>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
